[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cakewalk-next-mcp"
version = "1.0.0"
description = "MCP server for the Cakewalk Next DAW: project inspection, instrument library, MIDI generation, live MIDI, and UI automation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "cakewalk", "daw", "midi", "music", "bandlab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

# The only dependency. MIDI, PNG encoding, screen capture, window control and
# the .cnp parser are all standard library + ctypes, on purpose.
dependencies = ["mcp>=1.2"]

[project.urls]
Homepage = "https://github.com/x7-u/cakewalk-next-mcp"
Repository = "https://github.com/x7-u/cakewalk-next-mcp"
Issues = "https://github.com/x7-u/cakewalk-next-mcp/issues"

[project.scripts]
cakewalk-next-mcp = "cakewalk_next_mcp.server:main"

[tool.setuptools]
packages = ["cakewalk_next_mcp"]
